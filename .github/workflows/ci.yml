name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um novo push na mesma branch cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build e testes
    runs-on: ubuntu-latest

    # Postgres real para as migrations e os testes e2e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack -d fintrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack
      # Segredo descartável, válido só dentro deste job de CI
      JWT_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências (gera o client do Prisma no postinstall)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Testes unitários
        run: npm test

      - name: Testes e2e
        run: npm run test:e2e

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (estágio runtime)
        run: docker build --target runtime -t fintrack-api:ci .

  # Aplica as migrations no banco de produção (Neon) só depois que tudo
  # passou, e só em push na main. O Render espera este job terminar
  # (autoDeployTrigger: checksPass) antes de publicar a nova versão.
  migrate:
    name: Migrations em produção
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Conferir se o secret existe
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret PROD_DATABASE_URL não configurado no repositório"
            exit 1
          fi

      - run: npm ci

      - name: prisma migrate deploy
        run: npx prisma migrate deploy
